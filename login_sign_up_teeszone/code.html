<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TEESZONE Login / Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#4c463c",

                        "on-tertiary-container": "#999797",
                        "on-tertiary-fixed-variant": "#474646",
                        "surface-container-high": "#e9e8e7",
                        "surface-container-highest": "#e4e2e2",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#1f1b13",
                        "primary-container": "#5a1725",
                        "surface-variant": "#e4e2e2",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "on-tertiary-fixed": "#1c1b1b",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#ffb2bb",
                        "secondary-container": "#ebe1d3",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#6a6459",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#303030",
                        "on-surface-variant": "#544244",
                        "secondary-fixed-dim": "#cec5b8",
                        "error-container": "#ffdad6",
                        "background": "#fbf9f8",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#1b1b1b",
                        "on-primary-fixed": "#3e0212",
                        "error": "#ba1a1a",
                        "surface-tint": "#954552",
                        "primary": "#3e0211",
                        "surface-container-low": "#f5f3f3",
                        "outline": "#867274",
                        "surface": "#fbf9f8",
                        "inverse-on-surface": "#f2f0f0",
                        "inverse-surface": "#303031",
                        "on-primary-container": "#da7c89",
                        "surface-dim": "#dbdad9",
                        "secondary": "#645e53",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#efeded",
                        "on-primary-fixed-variant": "#782e3b",
                        "secondary-fixed": "#ebe1d3",
                        "outline-variant": "#d9c1c2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "stack-lg": "24px",
                        "unit": "4px",
                        "container-padding": "32px",
                        "stack-sm": "8px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "body-main": ["Inter"],
                        "kpi-value": ["Inter"],
                        "page-title": ["Inter"],
                        "page-title-mobile": ["Inter"],
                        "card-heading": ["Inter"],
                        "section-heading": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", { "lineHeight": "1", "letterSpacing": "0.08em", "fontWeight": "700" }],
                        "body-main": ["14px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "kpi-value": ["32px", { "lineHeight": "1", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "page-title": ["36px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "page-title-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "card-heading": ["16px", { "lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "section-heading": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-container-padding">
<div class="w-full max-w-md">
<!-- Logo -->
<div class="flex justify-center mb-stack-lg">
<img alt="TEESZONE Logo" class="h-12 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCYNMI04E7ChxxHmZ-aOg7KWfkZJ00IrVBZTkqGRiETGi2M1dL9cnsQ76eypmRVpWeDnY7O5eWbc06XF2QHk1OshIcdzxGaGIxfoClDwYw1jXprYfBb3esiZDE3KRomD3fsC2FgZbDxGsO7CciwkMUvgoCER01z3HeKyCorO7n60TJK8OUTJAAimEM-AONvGtPcnn6NumGHlWgxoI6wpcO9B52tJPlU5b7179_bunjVlIWFxj04upnI_Du0xBWbPg1i4Q"/>
</div>
<!-- Auth Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-lg shadow-sm">
<div class="text-center mb-stack-lg">
<h1 class="text-section-heading font-section-heading text-primary">Welcome Back</h1>
<p class="text-body-main font-body-main text-on-surface-variant mt-stack-sm">Sign in to your account or create a new one.</p>
</div>
<!-- Tab Toggle -->
<div class="flex border-b border-outline-variant mb-stack-lg">
<button class="flex-1 py-stack-sm text-card-heading font-card-heading text-primary border-b-2 border-primary" id="loginTabBtn" onclick="switchTab('login')">Login</button>
<button class="flex-1 py-stack-sm text-card-heading font-card-heading text-on-surface-variant hover:text-primary transition-colors" id="signupTabBtn" onclick="switchTab('signup')">Sign Up</button>
</div>
<!-- Login Form -->
<form class="block space-y-stack-md" id="loginForm">
<div>
<label class="block text-label-caps font-label-caps text-on-surface mb-unit" for="loginEmail">Email</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary px-3 py-2 text-body-main font-body-main outline-none transition-colors" id="loginEmail" placeholder="name@company.com" type="email"/>
</div>
<div>
<label class="block text-label-caps font-label-caps text-on-surface mb-unit" for="loginPassword">Password</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary px-3 py-2 text-body-main font-body-main outline-none transition-colors" id="loginPassword" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-center justify-between mt-stack-sm">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-body-main font-body-main text-on-surface-variant" for="remember-me">Remember me</label>
</div>
<div class="text-body-main font-body-main">
<a class="font-medium text-primary hover:text-primary-container" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary py-3 rounded-lg text-card-heading font-card-heading hover:bg-primary transition-colors mt-stack-md" type="submit">Log In</button>
</form>
<!-- Signup Form -->
<form class="hidden space-y-stack-md" id="signupForm">
<div>
<label class="block text-label-caps font-label-caps text-on-surface mb-unit" for="signupEmail">Work Email</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary px-3 py-2 text-body-main font-body-main outline-none transition-colors" id="signupEmail" placeholder="name@company.com" type="email"/>
</div>
<p class="text-label-caps font-label-caps text-on-surface-variant mt-stack-sm">A secure setup link will be sent to this email.</p>
<button class="w-full bg-primary-container text-on-primary py-3 rounded-lg text-card-heading font-card-heading hover:bg-primary transition-colors mt-stack-md" type="submit">Continue</button>
</form>
</div>
<div class="mt-stack-lg text-center text-label-caps font-label-caps text-on-surface-variant">
            © 2024 TEESZONE Clothing Private Limited. All rights reserved.
        </div>
</div>
<script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const signupTabBtn = document.getElementById('signupTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                
                loginTabBtn.classList.add('text-primary', 'border-b-2', 'border-primary');
                loginTabBtn.classList.remove('text-on-surface-variant');
                
                signupTabBtn.classList.remove('text-primary', 'border-b-2', 'border-primary');
                signupTabBtn.classList.add('text-on-surface-variant');
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                
                signupTabBtn.classList.add('text-primary', 'border-b-2', 'border-primary');
                signupTabBtn.classList.remove('text-on-surface-variant');
                
                loginTabBtn.classList.remove('text-primary', 'border-b-2', 'border-primary');
                loginTabBtn.classList.add('text-on-surface-variant');
            }
        }
    </script>
</body></html>
